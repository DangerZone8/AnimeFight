name: CI
on:
  push:
    branches: [main, "work/**", "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Install Chromium for mobile browser tests
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser tests
        run: npm run test:e2e
